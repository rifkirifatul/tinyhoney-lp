name: Auto Sync Fork

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        uses: a2ren/fork-sync-action@v1.0.0
        with:
          upstream_repository: 'alfinilmi/tinyhoney-lp' # Repo asli milik mereka
          target_branch: 'main'                         # Branch di repo fork kamu
          upstream_branch: 'main'                       # Branch di repo asli
          github_token: ${{ secrets.GITHUB_TOKEN }}
