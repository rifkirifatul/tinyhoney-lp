name: Auto Sync Fork

on:
  schedule:
    - cron: '0 * * * *' # Jalan tiap jam
  workflow_dispatch: # Supaya bisa di-trigger manual

permissions:
  contents: write # Wajib ada agar GITHUB_TOKEN punya akses push ke repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ambil seluruh histori commit

      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/alfinilmi/tinyhoney-lp.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "Merge upstream changes"
          git push origin main
